services:
  postgres:
    image: postgres:16-alpine
    container_name: personal-job-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: personal_job_agent
      POSTGRES_PASSWORD: personal_job_agent
      POSTGRES_DB: personal_job_agent
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - personal_job_agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_job_agent -d personal_job_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  personal_job_agent_postgres_data:
